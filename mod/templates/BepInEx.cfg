## BepInEx 配置（本模组只固定一件事：不要控制台窗口）
##
## 为什么随包带这个文件：BepInEx 默认会在游戏启动时开一个控制台窗口，
## 读屏玩家会先看到一个黑窗口闪一下再消失（我们的插件是加载后才去隐藏它，
## 挡不住那一下）。把 Logging.Console.Enabled 设为 false，控制台从一开始就不会被创建，
## 也就没有闪烁；日志照旧写进 BepInEx\LogOutput.log，不影响排障。
##
## 如果你本来就有 BepInEx：**不要覆盖这个文件**，只把你自己 BepInEx.cfg 里
## [Logging.Console] 的 Enabled 改成 false 即可（其它设置保持原样）。

[Logging.Console]

## Enables showing a console for log output.
# Setting type: Boolean
# Default value: true
Enabled = false
